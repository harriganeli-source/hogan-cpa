<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Access | Coming Soon | Hogan CPA Firm</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .coming-wrap {
            min-height: 100vh;
            background: var(--dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }
        .coming-wrap .mark {
            width: 90px;
            height: auto;
            margin-bottom: 2rem;
            filter: brightness(0) invert(1);
        }
        .coming-wrap .eyebrow {
            font-family: var(--sans);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.2rem;
        }
        .coming-wrap h1 {
            font-family: var(--serif);
            font-weight: 300;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            line-height: 1.15;
            margin-bottom: 1.2rem;
            color: var(--white);
        }
        .coming-wrap p {
            font-family: var(--sans);
            font-size: 1.02rem;
            line-height: 1.6;
            max-width: 34rem;
            color: rgba(255,255,255,0.82);
            margin-bottom: 0.6rem;
        }
        .coming-wrap .contact-line { color: var(--gold); }
        .coming-wrap .contact-line a { color: var(--gold); text-decoration: none; }
        .coming-wrap .actions { margin-top: 2.4rem; }
        .coming-wrap .btn-back {
            font-family: var(--sans);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--white);
            text-decoration: none;
            padding: 0.75rem 1.6rem;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 2px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .coming-wrap .btn-back:hover { background: rgba(255,255,255,0.08); border-color: var(--white); }
    </style>
</head>
<body>
    <div class="coming-wrap">
        <img src="images/hogan-signature.svg" alt="Hogan CPA Firm" class="mark">
        <p class="eyebrow">Client Access</p>
        <h1>Coming soon.</h1>
        <p>Secure client login and file upload are being set up and will live here shortly.</p>
        <p class="contact-line">In the meantime, reach Sarah directly at <a href="mailto:sarah@hogancpafirm.com">sarah@hogancpafirm.com</a> or <a href="tel:+18506806171">850-680-6171</a>.</p>
        <div class="actions">
            <a href="index.html" class="btn-back">&#8592; &nbsp;Back to Hogan CPA Firm</a>
        </div>
    </div>
</body>
</html>
